version: '3.8'

services:
  # 1. Primary Datastore
  postgres:
    image: postgres:16-alpine
    container_name: quantumflix-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password_123_change_in_prod
      POSTGRES_DB: quantumflix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - quantumflix_network

  # 2. Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: quantumflix-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - quantumflix_network

  # 3. Secure Auth Microservice
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: always
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - DATABASE_URL=postgresql://postgres:postgres_password_123_change_in_prod@postgres:5432/quantumflix?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=access_secret_123_change_in_prod
      - JWT_REFRESH_SECRET=refresh_secret_123_change_in_prod
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      - postgres
      - redis
    networks:
      - quantumflix_network

  # 4. Catalog Microservice
  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    container_name: catalog-service
    restart: always
    ports:
      - "5002:5002"
    environment:
      - NODE_ENV=production
      - PORT=5002
      - DATABASE_URL=postgresql://postgres:postgres_password_123_change_in_prod@postgres:5432/quantumflix?schema=public
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      - postgres
      - redis
    networks:
      - quantumflix_network

  # 5. Streaming Microservice
  streaming-service:
    build:
      context: ./streaming-service
      dockerfile: Dockerfile
    container_name: streaming-service
    restart: always
    ports:
      - "5003:5003"
    environment:
      - NODE_ENV=production
      - PORT=5003
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=access_secret_123_change_in_prod
      - CDN_DOMAIN=https://cdn.quantumflix.com
      - CLOUDFRONT_KEY_PAIR_ID=KXXXXXXXXXXXXX
      - CLOUDFRONT_PRIVATE_KEY=
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      - redis
    networks:
      - quantumflix_network

  # 6. API Gateway (Reverse Proxy Router)
  nginx:
    image: nginx:1.25-alpine
    container_name: quantumflix-nginx-gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ../infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - catalog-service
      - streaming-service
    networks:
      - quantumflix_network

  # 7. Metrics Aggregation
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: quantumflix-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ../infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - auth-service
      - catalog-service
      - streaming-service
    networks:
      - quantumflix_network

  # 8. Visualization Dashboard
  grafana:
    image: grafana/grafana:10.4.2
    container_name: quantumflix-grafana
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - quantumflix_network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  quantumflix_network:
    driver: bridge
